[package]
name = "contextboard-desktop"
version = "0.0.0"
description = "Contextboard Windows desktop shell"
authors = ["Contextboard"]
edition = "2021"

[lib]
name = "contextboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
