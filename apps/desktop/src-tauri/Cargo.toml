[package]
name = "contextboard-desktop"
version = "0.0.0"
description = "Contextboard Windows desktop shell"
authors = ["Contextboard"]
edition = "2021"

[lib]
name = "contextboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Synchronous, threaded HTTP for the loopback agent bridge. Matches the
# blocking rusqlite storage layer, so no async runtime is pulled in.
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
